<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Otaku | Kawaii Edition 🌸</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    
    <header class="main-header">
        <div class="logo">
            <h2>🌸 Otaku shop 🌸</h2>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Buscar animes, figuras, tazas...">
        </div>
        <div class="cart-icon">
            <span>🛒</span>
            <span id="cart-counter" class="counter">0</span>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="shop-container">
        
        <!-- Panel Lateral (Filtros) -->
        <aside class="sidebar-filters">
            <h3>Categorías</h3>
            <ul>
                <li><a href="">🎀 Figuras</a></li>
                <li><a href="">👕 Camisetas</a></li>
                <li><a href="">☕ Tazas</a></li>
            </ul>
            
            <h3>Series Populares</h3>
            <ul>
                <li><input type="checkbox"> Sailor Moon</li>
                <li><input type="checkbox"> Cardcaptor Sakura</li>
                <li><input type="checkbox"> Studio Ghibli</li>
            </ul>
        </aside>

        <!-- Cuadrícula de Productos -->
        <section class="products-grid" id="products-grid">
            <!-- Las tarjetas de producto se inyectarán aquí con JavaScript -->
        </section>

    </main>
    <!-- Modal del Carrito (Oculto por defecto) -->
    <div id="cart-modal" class="cart-modal">
        <div class="cart-header">
            <h3>Tu Carrito 🛒</h3>
            <button id="close-cart" class="close-btn">❌</button>
        </div>
        
        <div id="cart-items" class="cart-items">
            <!-- Los productos seleccionados aparecerán aquí -->
        </div>
        
        <div class="cart-footer">
            <p class="total-text">Total: <span id="cart-total">0.00</span> €</p>
            <!-- Este botón nos llevará luego a la simulación de pago -->
            <button class="btn-checkout">Proceder al Pago ✨</button>
        </div>
    </div>

    <!-- Modal de Checkout Simulado -->
    <div class="checkout-overlay" id="checkout-overlay">
        <div class="checkout-modal">
            <div class="checkout-header">
                <h3>Finalizar Compra 💖</h3>
                <button id="close-checkout" class="close-btn">❌</button>
            </div>
            <form id="checkout-form">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="nombre-cliente" placeholder="Ej: Sakura Kinomoto" required>
                </div>
                <div class="form-group">
                    <label>Dirección de Envío</label>
                    <input type="text" placeholder="Calle, Ciudad, Código Postal" required>
                </div>
                <div class="form-group">
                    <label>Tarjeta de Crédito (Simulada)</label>
                    <input type="text" placeholder="0000 0000 0000 0000" minlength="16" maxlength="16" required>
                </div>
                <button type="submit" class="btn-checkout">Pagar y Completar Pedido 🌸</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
